name: Sync LeetCode submissions

on:
  schedule:
    # GitHub Actions uses UTC. Poll every 15 minutes, away from the top of the hour.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-leetcode-submissions
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Export accepted Go submissions
        env:
          LEETCODE_COOKIES: ${{ secrets.LEETCODE_COOKIES }}
        run: |
          if [ -z "$LEETCODE_COOKIES" ]; then
            echo "LEETCODE_COOKIES is not configured. Add it as a repository Actions secret."
            exit 1
          fi

          export_dir="$(mktemp -d "$RUNNER_TEMP/leetcode-export.XXXXXX")"
          echo "EXPORT_DIR=$export_dir" >> "$GITHUB_ENV"

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --workdir /usr/app/out \
            -v "$export_dir:/usr/app/out" \
            nevermendel/leetcode-export \
            --cookies "$LEETCODE_COOKIES" \
            --folder /usr/app/out \
            --only-accepted \
            --language=golang \
            --no-problem-statement \
            --problem-folder-name='${question_id}-${title_slug}' \
            --submission-filename='${id}.go'

      - name: Zero-pad problem IDs
        run: |
          python3 scripts/normalize_problem_folders.py \
            "$EXPORT_DIR" \
            --destination "$GITHUB_WORKSPACE"

      - name: Commit new submissions to automation branch
        id: changes
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No new accepted Go submissions."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          branch="automation/leetcode-sync"
          # Fetch the workflow-owned remote branch so force-with-lease can
          # safely update an existing pull request branch.
          git fetch origin "$branch:refs/remotes/origin/$branch" || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -m "Sync accepted LeetCode submissions"
          git push --force-with-lease origin "HEAD:refs/heads/$branch"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Open, update, and merge pull request
        if: steps.changes.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          branch="automation/leetcode-sync"
          existing_pr="$(
            gh pr list \
              --head "$branch" \
              --base "$BASE_BRANCH" \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [ -n "$existing_pr" ]; then
            echo "Updated pull request #$existing_pr."
          else
            pr_url="$(gh pr create \
              --head "$branch" \
              --base "$BASE_BRANCH" \
              --title "Sync accepted LeetCode submissions" \
              --body "Automated export of new accepted Go submissions from LeetCode.")"
            existing_pr="${pr_url##*/}"
          fi

          gh pr merge "$existing_pr" --squash --delete-branch
